        - paragraph [ref=e46]: MacWest recorded a net loss of GH¢ 12.53M for H1 2026 (ended 30 June 2026), driven by direct costs exceeding revenue and a substantial increase in borrowings to GH¢ 18.18M. Revenue reached GH¢ 28.33M, broadly in line with FY 2025 full-year revenue of GH¢ 29.30M, demonstrating significant top-line scaling. However, gross margin turned negative at -24.6%, reflecting cost overruns on major projects. Cash reserves decreased sharply from GH¢ 5.76M (Q1 2026) to GH¢ 0.83M. The company's equity position is now negative at -GH¢ 6.84M. Immediate cost control, project margin recovery, and working capital management are critical priorities.
